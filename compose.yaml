services:
  web:
    build: .
    mem_limit: 512m
    ports:
      - "127.0.0.1:${APP_PORT:-18094}:8080"
    environment:
      JAVA_OPTS: -Xms64m -Xmx320m
      DB_URL: jdbc:mysql://db:3306/cafe_dino?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: cafe
      DB_PASSWORD: ${DB_PASSWORD:?Salin .env.example ke .env dan isi DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    mem_limit: 512m
    command: ["--innodb-buffer-pool-size=64M", "--performance-schema=OFF", "--max-connections=30"]
    environment:
      MYSQL_DATABASE: cafe_dino
      MYSQL_USER: cafe
      MYSQL_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - cafe-data:/var/lib/mysql
      - ./database/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP --host=127.0.0.1 --user=\"$$MYSQL_USER\" --database=\"$$MYSQL_DATABASE\" --execute='SELECT 1' --silent >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  cafe-data:
