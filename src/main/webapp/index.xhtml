<ui:composition template="/WEB-INF/template.xhtml" xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://xmlns.jcp.org/jsf/passthrough">
<ui:define name="title">Masuk</ui:define>
<ui:define name="content">
  <section class="auth-panel">
    <h1>Masuk ke DinoCafe</h1><p>Kelola daftar produk, harga, dan stok kafe.</p>
    <ui:fragment rendered="#{not empty param.registered}"><p class="notice" role="status">Akun berhasil dibuat. Silakan masuk.</p></ui:fragment>
    <ui:fragment rendered="#{not empty param.loggedOut}"><p class="notice" role="status">Kamu sudah keluar.</p></ui:fragment>
    <h:form id="login">
      <input type="hidden" name="csrf" value="#{security.csrf}"/>
      <h:outputLabel for="email" value="Email"/><h:inputText id="email" value="#{auth.email}" required="true" maxlength="254" p:type="email" p:autocomplete="username"/>
      <h:outputLabel for="password" value="Password"/><h:inputSecret id="password" value="#{auth.password}" required="true" maxlength="128" p:autocomplete="current-password"/>
      <h:commandButton value="Masuk" action="#{auth.login}"/>
    </h:form>
    <p>Belum punya akun? <h:link outcome="register" value="Buat akun demo"/>.</p>
  </section>
</ui:define></ui:composition>
